version: '3.8'

# Only1MCP Docker Compose Configuration
# For local development and testing

services:
  # Only1MCP Proxy Server
  only1mcp:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: only1mcp-proxy
    ports:
      - "8080:8080"    # Main proxy port
      - "9090:9090"    # Prometheus metrics
      - "8081:8081"    # Admin API
    volumes:
      # Mount config directory
      - ../config:/etc/only1mcp:ro
      # Mount data directory
      - only1mcp_data:/var/lib/only1mcp
      # Mount logs
      - only1mcp_logs:/var/log/only1mcp
    environment:
      - RUST_LOG=info
      - ONLY1MCP_CONFIG=/etc/only1mcp/templates/solo.yaml
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - only1mcp_network
    restart: unless-stopped

  # Prometheus for metrics collection
  prometheus:
    image: prom/prometheus:latest
    container_name: only1mcp-prometheus
    ports:
      - "9091:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
    networks:
      - only1mcp_network
    restart: unless-stopped

  # Grafana for visualization
  grafana:
    image: grafana/grafana:latest
    container_name: only1mcp-grafana
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./grafana/datasources:/etc/grafana/provisioning/datasources:ro
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    networks:
      - only1mcp_network
    depends_on:
      - prometheus
    restart: unless-stopped

  # Redis for caching and rate limiting
  redis:
    image: redis:7-alpine
    container_name: only1mcp-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    networks:
      - only1mcp_network
    restart: unless-stopped

  # Example MCP Server 1 - Filesystem
  mcp-filesystem:
    image: node:18-alpine
    container_name: mcp-filesystem-server
    working_dir: /app
    command: sh -c "npm install -g @modelcontextprotocol/server-filesystem && mcp-server-filesystem /data"
    volumes:
      - mcp_test_data:/data
    networks:
      - only1mcp_network
    restart: unless-stopped

  # Example MCP Server 2 - GitHub
  mcp-github:
    image: node:18-alpine
    container_name: mcp-github-server
    working_dir: /app
    environment:
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}
    command: sh -c "npm install -g @modelcontextprotocol/server-github && mcp-server-github"
    networks:
      - only1mcp_network
    restart: unless-stopped

  # Nginx reverse proxy (optional)
  nginx:
    image: nginx:alpine
    container_name: only1mcp-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
      - nginx_logs:/var/log/nginx
    depends_on:
      - only1mcp
    networks:
      - only1mcp_network
    restart: unless-stopped
    profiles:
      - production

  # Jaeger for distributed tracing (optional)
  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: only1mcp-jaeger
    ports:
      - "16686:16686"  # Jaeger UI
      - "14268:14268"  # Collector HTTP
      - "14250:14250"  # Collector gRPC
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    networks:
      - only1mcp_network
    restart: unless-stopped
    profiles:
      - observability

networks:
  only1mcp_network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

volumes:
  only1mcp_data:
  only1mcp_logs:
  prometheus_data:
  grafana_data:
  redis_data:
  mcp_test_data:
  nginx_logs:

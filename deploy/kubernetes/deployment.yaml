apiVersion: v1
kind: Namespace
metadata:
  name: only1mcp
  labels:
    app.kubernetes.io/name: only1mcp
    app.kubernetes.io/part-of: only1mcp
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: only1mcp-config
  namespace: only1mcp
data:
  config.yaml: |
    # Production Kubernetes Configuration
    host: "0.0.0.0"
    port: 8080

    log_level: "info"
    log_format: "json"

    # MCP Backend Servers
    servers:
      mcp-primary:
        name: "Primary MCP Server"
        transport:
          http:
            url: "http://mcp-backend-service:3000"
            timeout_ms: 5000
        enabled: true
        priority: 100
        weight: 2
        health_check:
          enabled: true
          path: "/health"
          interval_secs: 15

      mcp-secondary:
        name: "Secondary MCP Server"
        transport:
          http:
            url: "http://mcp-backend-service-2:3000"
            timeout_ms: 5000
        enabled: true
        priority: 90
        weight: 1
        health_check:
          enabled: true
          path: "/health"
          interval_secs: 15

    # Load balancing
    load_balancing:
      strategy: "weighted_least_connections"
      health_check_interval: 10
      failure_threshold: 2
      recovery_threshold: 3
      circuit_breaker:
        enabled: true
        error_threshold_percentage: 50
        min_requests: 10
        timeout_duration_secs: 30

    # Aggressive caching
    cache:
      enabled: true
      ttl: 600
      max_size: 10000
      compression: "zstd"

    # Request batching
    batching:
      enabled: true
      window_ms: 50
      max_batch_size: 50

    # Rate limiting
    rate_limiting:
      enabled: true
      requests_per_minute: 1000
      burst_size: 1500

    # JWT Authentication
    authentication:
      enabled: true
      jwt:
        secret: "${JWT_SECRET}"
        algorithm: "HS256"
        token_expiry_hours: 24

    # Multi-tenancy
    multi_tenancy:
      enabled: true
      default_tier: "pro"

    # Metrics
    metrics:
      enabled: true
      prometheus_port: 9090
      collection_interval: 10

    # AI Optimization
    ai_optimization:
      enabled: true
      ml_routing:
        enabled: true
        history_size: 10000
      predictive_cache:
        enabled: true
        preload_top_n: 50
      anomaly_detection:
        enabled: true
        sensitivity: 3.0

    # Admin API
    admin_api:
      enabled: true
      port: 8081
      auth_required: true

    hot_reload: false
---
apiVersion: v1
kind: Secret
metadata:
  name: only1mcp-secrets
  namespace: only1mcp
type: Opaque
stringData:
  jwt-secret: "CHANGE_ME_IN_PRODUCTION"
  # Add other secrets as needed
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: only1mcp
  namespace: only1mcp
  labels:
    app: only1mcp
    version: v0.5.0
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: only1mcp
  template:
    metadata:
      labels:
        app: only1mcp
        version: v0.5.0
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: only1mcp
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
      - name: only1mcp
        image: only1mcp:0.5.0
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 8080
          protocol: TCP
        - name: metrics
          containerPort: 9090
          protocol: TCP
        - name: admin
          containerPort: 8081
          protocol: TCP
        env:
        - name: RUST_LOG
          value: "info"
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: only1mcp-secrets
              key: jwt-secret
        volumeMounts:
        - name: config
          mountPath: /etc/only1mcp
          readOnly: true
        resources:
          requests:
            cpu: 500m
            memory: 512Mi
          limits:
            cpu: 2000m
            memory: 2Gi
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 2
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
      volumes:
      - name: config
        configMap:
          name: only1mcp-config
---
apiVersion: v1
kind: Service
metadata:
  name: only1mcp
  namespace: only1mcp
  labels:
    app: only1mcp
spec:
  type: ClusterIP
  ports:
  - name: http
    port: 8080
    targetPort: 8080
    protocol: TCP
  - name: metrics
    port: 9090
    targetPort: 9090
    protocol: TCP
  - name: admin
    port: 8081
    targetPort: 8081
    protocol: TCP
  selector:
    app: only1mcp
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: only1mcp
  namespace: only1mcp
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: only1mcp-hpa
  namespace: only1mcp
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: only1mcp
  minReplicas: 3
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
      - type: Percent
        value: 50
        periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
      - type: Percent
        value: 100
        periodSeconds: 30
      - type: Pods
        value: 2
        periodSeconds: 30
      selectPolicy: Max
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: only1mcp-pdb
  namespace: only1mcp
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: only1mcp
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: only1mcp
  namespace: only1mcp
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/rate-limit: "100"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  tls:
  - hosts:
    - only1mcp.example.com
    secretName: only1mcp-tls
  rules:
  - host: only1mcp.example.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: only1mcp
            port:
              number: 8080
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: only1mcp
  namespace: only1mcp
  labels:
    app: only1mcp
spec:
  selector:
    matchLabels:
      app: only1mcp
  endpoints:
  - port: metrics
    interval: 30s
    path: /metrics
